name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The protocol core is sans-IO and the integration tests replay recorded
      # transcripts, so nothing external is needed here: no host, no network,
      # no Python.
      - name: Test
        run: cargo test --all-features

      # Also build with no features at all, to keep the core dependency-free.
      - name: Build the core alone
        run: cargo build --no-default-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The native-only build has its own cfg paths, and a break there is
      # invisible to --all-features. GitHub runners ship libssl-dev, so the
      # system OpenSSL is used rather than the vendored one.
      - name: Clippy with only the native TLS backend
        run: cargo clippy --all-targets --features tls-native -- -D warnings

      - name: Clippy with only the rustls backend
        run: cargo clippy --all-targets --features tls-rustls -- -D warnings

      - name: Format
        run: cargo fmt --check
